name: Backend Tests

on:
  push:
    branches:
      - main
      - refactor/production-v2

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Pytest on Python 3.12
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inventory_test_db

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres -d inventory_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/inventory_test_db
      TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/inventory_test_db
      SECRET_KEY: github-actions-test-secret-key
      ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check application import
        run: python -c "from app.main import app; print('Application import OK')"

      - name: Compile Python files
        run: python -m compileall app tests

      - name: Run tests with coverage
        run: >
          python -m pytest
          --cov=app
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=90
          -v

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore