name: Backend Tests

on:
  push:
    branches:
      - main
      - refactor/production-v2
    tags:
      - "v*"

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Pytest on Python 3.12
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inventory_test_db

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres -d inventory_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/inventory_test_db
      TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/inventory_test_db

      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: inventory_test_db
      DB_USER: postgres
      DB_PASSWORD: postgres

      SECRET_KEY: github-actions-test-secret-key
      ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check application import
        run: python -c "from app.main import app; print('Application import OK')"

      - name: Compile Python files
        run: python -m compileall app tests scripts

      - name: Dependency vulnerability audit (advisory)
        # Advisory only: passlib 1.7.4 is unmaintained and a couple of
        # transitive advisories (ecdsa) do not affect HS256 usage. Tracked in
        # docs/release-checklist.md; revisit when migrating off passlib.
        continue-on-error: true
        run: |
          python -m pip install pip-audit
          python -m pip_audit --strict --desc || true

      - name: Build Docker image
        run: docker build -t inventory-system-api:test .

      - name: Prepare Docker environment files
        run: |
          cp .env.api.example .env.api
          cp .env.db.example .env.db
          cp .env.production.example .env.production

      - name: Validate Docker Compose (dev)
        run: docker compose -f compose.yml config

      - name: Validate Docker Compose (prod)
        env:
          API_IMAGE: ghcr.io/thoranin45/inventory-management-system:ci-validate
          POSTGRES_USER: inventory
          POSTGRES_DB: inventory_db
        run: docker compose -f compose.prod.yml config

      - name: Migration test suites
        run: >
          python -m pytest -q
          tests/test_migrations.py
          tests/test_phase5_migrations.py
          tests/test_phase6_migrations.py
          tests/test_phase8_migrations.py
          tests/test_phase9_migration.py

      - name: Run tests with coverage
        run: >
          python -m pytest
          --cov=app
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=90
          -v
      
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/refactor/production-v2' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: github.event_name == 'push' && (github.ref == 'refs/heads/refactor/production-v2' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/setup-buildx-action@v3

      - name: Compute image tags
        if: github.event_name == 'push' && (github.ref == 'refs/heads/refactor/production-v2' || startsWith(github.ref, 'refs/tags/v'))
        id: imgtags
        run: |
          TAGS="ghcr.io/thoranin45/inventory-management-system:${{ github.sha }}"
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            TAGS="$TAGS,ghcr.io/thoranin45/inventory-management-system:${{ github.ref_name }}"
          else
            TAGS="$TAGS,ghcr.io/thoranin45/inventory-management-system:latest"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        # Always publishes an immutable :<sha> tag (a pinnable rollback
        # anchor); :latest is a convenience alias only, never the sole tag.
        if: github.event_name == 'push' && (github.ref == 'refs/heads/refactor/production-v2' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.imgtags.outputs.tags }}
      
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore

      