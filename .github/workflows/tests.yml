name: Backend Tests

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:
    branches:
      - main

# Least privilege: only the publish job (v* tags) can write packages.
permissions:
  contents: read

jobs:
  test:
    name: Pytest on Python 3.12
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inventory_test_db

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres -d inventory_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/inventory_test_db
      TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/inventory_test_db

      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: inventory_test_db
      DB_USER: postgres
      DB_PASSWORD: postgres

      SECRET_KEY: github-actions-test-secret-key-min-32-bytes
      ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check application import
        run: python -c "from app.main import app; print('Application import OK')"

      - name: Compile Python files
        run: python -m compileall app tests scripts

      - name: Dependency vulnerability audit
        # Gating: fails on any known vulnerability in the pinned
        # requirements.txt (a full freeze, so --no-deps audits exactly what
        # the image installs). If a newly published advisory turns this red
        # on an unrelated PR, triage it: upgrade, or add a dated
        # `--ignore-vuln <ID>` with a tracked follow-up. Do not revert the gate.
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit --strict --desc --no-deps -r requirements.txt

      - name: Build Docker image
        run: docker build -t inventory-system-api:test .

      - name: Prepare Docker environment files
        run: |
          cp .env.api.example .env.api
          cp .env.db.example .env.db
          cp .env.production.example .env.production
          cp .env.production.app.example .env.production.app

      - name: Validate Docker Compose (dev)
        run: docker compose -f compose.yml config

      - name: Validate Docker Compose (prod)
        env:
          API_IMAGE: ghcr.io/thoranin45/inventory-management-system:ci-validate
          FRONTEND_IMAGE: ghcr.io/thoranin45/inventory-management-system-frontend:ci-validate
        run: docker compose -f compose.prod.yml config --quiet

      - name: Validate nginx config (prod)
        # No --add-host: the upstream uses `resolve`, so the config must load
        # even when `frontend` cannot be resolved yet.
        run: >
          docker run --rm
          -v "$PWD/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro"
          nginx:1.27-alpine nginx -t

      - name: Migration test suites
        run: >
          python -m pytest -q
          tests/test_migrations.py
          tests/test_phase5_migrations.py
          tests/test_phase6_migrations.py
          tests/test_phase8_migrations.py
          tests/test_phase9_migration.py

      - name: Run tests with coverage
        run: >
          python -m pytest
          --cov=app
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=90
          -v
      
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore

  publish:
    # Runs only for v* tags, after the full test job passed. Publishes the API
    # and frontend images with the same two immutable tags: :<git-sha> and
    # :<tag>. There is no :latest; deployments pin one of these.
    name: Publish images
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      API_REPO: ghcr.io/thoranin45/inventory-management-system
      FRONTEND_REPO: ghcr.io/thoranin45/inventory-management-system-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push API image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.API_REPO }}:${{ github.sha }}
            ${{ env.API_REPO }}:${{ github.ref_name }}

      - name: Build and push frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          push: true
          tags: |
            ${{ env.FRONTEND_REPO }}:${{ github.sha }}
            ${{ env.FRONTEND_REPO }}:${{ github.ref_name }}
