name: inventory-system

services:
  db:
    image: postgres:18
    container_name: inventory-postgres
    restart: unless-stopped

    env_file:
      - .env.production

    expose:
      - "5432"

    volumes:
      - inventory_postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  api:
    image: ghcr.io/thoranin45/inventory-management-system:latest
    container_name: inventory-api
    restart: unless-stopped

    env_file:
      - .env.production

    expose:
      - "8081"

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/api/v1/health/', timeout=3)"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    command: >
      sh -c "
      alembic upgrade head &&
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8081
      "

    volumes:
      - inventory_uploads:/app/uploads
      - inventory_exports:/app/exports
      - inventory_logs:/app/logs
      - inventory_invoices:/app/app/static/invoices

  nginx:
    image: nginx:1.27-alpine
    container_name: inventory-nginx
    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      api:
        condition: service_healthy

volumes:
  inventory_postgres_data:
  inventory_uploads:
  inventory_exports:
  inventory_logs:
  inventory_invoices: