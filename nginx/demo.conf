# Demo reverse proxy — browser traffic to Next.js only.
#
#   client --HTTPS--> Tailscale Funnel (terminates TLS) --HTTP--> this nginx
#          --HTTP--> frontend:3000 (Next + BFF) --HTTP--> api:8081 --> db
#
# FastAPI and PostgreSQL are never proxied here and never published.
# No TLS config: Funnel terminates TLS externally. A VPS/Certbot variant is
# documented in docs/demo-deployment.md but not implemented here.
#
# Mounted by compose.demo.yml at /etc/nginx/conf.d/default.conf.
# nginx/default.conf (the production / direct-to-API config) is left untouched.

# Restore the real external client address into $remote_addr / X-Real-IP so
# the Next BFF can forward exactly that one authoritative value to FastAPI
# (rate limiting + request logs).
#
# The ONLY path that can reach this nginx is Tailscale Funnel: the compose
# host port is bound to 127.0.0.1 only, and Docker's port-forward makes that
# connection arrive at the nginx container from the Docker bridge gateway (a
# private address, not 127.0.0.1). So the single trusted hop is "the bridge
# gateway" — expressed as the RFC1918 ranges Docker draws bridge subnets
# from. Nothing else on the host or the Internet can connect here.
#
# Funnel sets X-Forwarded-For to the true client; with real_ip_recursive on,
# nginx walks the XFF list right-to-left past trusted hops and stops at the
# first non-trusted address — Funnel's real-client entry. A client-supplied
# X-Forwarded-For value always sits LEFT of that entry and is never selected,
# so it cannot be spoofed. The Tailscale CGNAT range (100.64.0.0/10) is
# deliberately NOT trusted: a tailnet client's own 100.x address must be
# taken as the real client, not seen through.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Preserve the external scheme reported by Funnel (Funnel -> nginx is plain http).
map $http_x_forwarded_proto $forwarded_proto {
    default   $scheme;
    "https"   "https";
    "http"    "http";
}

upstream demo_frontend {
    server frontend:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    server_tokens off;

    # >= backend MAX_UPLOAD_BYTES (5 MiB) plus multipart framing overhead.
    client_max_body_size 20M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/json application/javascript application/xml text/css text/plain image/svg+xml;

    # Everything the browser sends — pages, /api/auth/*, /api/bff/* — is served
    # by the Next.js app. There is deliberately NO `location /api/v1/`.
    location / {
        proxy_pass http://demo_frontend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        # Stream binary downloads (XLSX / PDF / PNG via the BFF) rather than
        # buffering them to disk. Request bodies (<= 5 MiB uploads) keep the
        # default buffering.
        proxy_buffering off;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
