name: inventory-demo

# Demo stack — additive, separate from compose.prod.yml (unchanged).
#
#   [Tailscale Funnel, host-level] --> nginx (127.0.0.1:8080) --> frontend:3000
#        --> api:8081 --> db:5432
#
# Only nginx is published, and only on loopback. api and db are internal.
# The api image starts uvicorn ONLY — migrations are the one-shot `migrate`
# profile. Demo data is the one-shot `seed` profile.
#
# Images are pinned (no :latest):
#   API_IMAGE=inventory-api:sha-<sha>   FRONTEND_IMAGE=inventory-frontend:sha-<sha>
# All configuration + secrets come from .env.demo (git-ignored; template is
# .env.demo.example). See docs/demo-deployment.md.

networks:
  inventory-demo:
    name: inventory-demo
    driver: bridge

volumes:
  inventory_demo_postgres_data:
    name: inventory-demo-postgres-data
  inventory_demo_uploads:
    name: inventory-demo-uploads
  inventory_demo_exports:
    name: inventory-demo-exports
  inventory_demo_logs:
    name: inventory-demo-logs
  inventory_demo_invoices:
    name: inventory-demo-invoices

services:
  db:
    image: postgres:18
    container_name: inventory-demo-postgres
    restart: unless-stopped
    networks: [inventory-demo]
    env_file: [.env.demo]
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    # No host port. Internal only.
    expose:
      - "5432"
    volumes:
      - inventory_demo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # One-shot: apply Alembic migrations. Never starts with `up`.
  #   docker compose -f compose.demo.yml --profile migrate run --rm migrate
  migrate:
    image: ${API_IMAGE:?set API_IMAGE, e.g. inventory-api:sha-<sha>}
    profiles: ["migrate"]
    networks: [inventory-demo]
    env_file: [.env.demo]
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    image: ${API_IMAGE:?set API_IMAGE, e.g. inventory-api:sha-<sha>}
    container_name: inventory-demo-api
    restart: unless-stopped
    networks: [inventory-demo]
    env_file: [.env.demo]
    # No host port. Internal only. No command override: the image CMD runs
    # uvicorn --proxy-headers and does NOT run migrations.
    expose:
      - "8081"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - inventory_demo_uploads:/app/uploads
      - inventory_demo_exports:/app/exports
      - inventory_demo_logs:/app/logs
      - inventory_demo_invoices:/app/app/static/invoices
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=3).status==200 else 1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # One-shot: DEMO/QA-ONLY data. Never starts with `up`. Requires SEED_CONFIRM=1
  # and an explicit demo DB target in .env.demo; refuses production-like targets.
  #   docker compose -f compose.demo.yml --profile seed run --rm seed
  seed:
    image: ${API_IMAGE:?set API_IMAGE, e.g. inventory-api:sha-<sha>}
    profiles: ["seed"]
    networks: [inventory-demo]
    env_file: [.env.demo]
    environment:
      DEMO_API: http://api:8081/api/v1
      PYTHONPATH: /app
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    command: ["python", "scripts/seed_demo.py"]
    restart: "no"

  frontend:
    image: ${FRONTEND_IMAGE:?set FRONTEND_IMAGE, e.g. inventory-frontend:sha-<sha>}
    container_name: inventory-demo-frontend
    restart: unless-stopped
    networks: [inventory-demo]
    # No host port. Internal only. API_BASE_URL is server-side runtime config
    # (never in the browser bundle).
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      API_BASE_URL: http://api:8081
      SESSION_COOKIE_NAME: wc_session
      COOKIE_SECURE: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/login"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  nginx:
    image: nginx:1.27-alpine
    container_name: inventory-demo-nginx
    restart: unless-stopped
    networks: [inventory-demo]
    # Loopback only. Tailscale Funnel (host-level) targets http://127.0.0.1:8080.
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/demo.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/login"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
